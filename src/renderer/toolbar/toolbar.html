<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
  <title>LabLock</title>
  <link rel="stylesheet" href="toolbar.css" />
</head>
<body>
  <div class="toolbar-brand" aria-hidden="true">
    <span class="toolbar-brand-mark">LL</span>
    <span class="toolbar-brand-name">LabLock</span>
  </div>

  <button id="home-btn" type="button" class="toolbar-btn" aria-label="Return to home grid">
    <svg class="toolbar-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>Home</span>
  </button>

  <div class="toolbar-status" aria-live="polite" aria-atomic="true">
    <svg class="toolbar-status-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span>Secured</span>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
