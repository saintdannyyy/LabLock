<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>LabLock</title>
  <link rel="stylesheet" href="toolbar.css" />
</head>
<body>
  <div class="toolbar-brand" aria-hidden="true">
    <span class="toolbar-brand-icon">LL</span>
    <span>LabLock</span>
  </div>
  <button id="home-btn" type="button" aria-label="Return to home grid">
    <svg class="home-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
    <span>Home</span>
  </button>
  <div class="toolbar-status" aria-live="polite" aria-atomic="true">
    <span class="toolbar-status-dot" aria-hidden="true"></span>
    <span>Secured</span>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
