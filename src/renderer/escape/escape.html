<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Escape</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e1e; color: #e0e0e0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .dialog { background: #2d2d2d; border: 1px solid #444; border-radius: 8px; padding: 32px; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 8px; font-size: 1.25rem; font-weight: 600; color: #fff; }
    p { margin-bottom: 24px; font-size: 0.875rem; color: #aaa; }
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: #888; }
    input[type="password"] { padding: 12px 16px; border: 1px solid #444; border-radius: 4px; background: #1e1e1e; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input[type="password"]:focus { border-color: #0078d4; }
    .buttons { display: flex; justify-content: flex-end; gap: 12px; }
    button { padding: 10px 20px; border: none; border-radius: 4px; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn-cancel { background: #3d3d3d; color: #e0e0e0; }
    .btn-cancel:hover { background: #4a4a4a; }
    .btn-exit { background: #d13438; color: #fff; }
    .btn-exit:hover { background: #b32d31; }
    .error { color: #f14c4c; font-size: 0.75rem; margin-top: 8px; display: none; }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="dialog" role="dialog" aria-labelledby="title" aria-modal="true">
    <h2 id="title">Admin Escape Hatch</h2>
    <p>Enter the admin password to exit kiosk mode.</p>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="off" placeholder="Enter password" aria-label="Admin password">
    </div>
    <div class="error" id="error" aria-live="polite">Incorrect password</div>
    <div class="buttons">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-exit" id="exitBtn">Exit Kiosk</button>
    </div>
  </div>
  <script>
    const passwordInput = document.getElementById('password');
    const cancelBtn = document.getElementById('cancelBtn');
    const exitBtn = document.getElementById('exitBtn');
    const errorEl = document.getElementById('error');
    const { ipcRenderer } = require('electron');

    let submitted = false;

    function submit() {
      if (submitted) return;
      submitted = true;
      const pwd = passwordInput.value;
      ipcRenderer.send('escape:password-result', pwd);
    }

    exitBtn.addEventListener('click', submit);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });
    cancelBtn.addEventListener('click', () => {
      ipcRenderer.send('escape:password-result', '__CANCEL__');
    });

    // Focus password field on load
    passwordInput.focus();
  </script>
</body>
</html>
