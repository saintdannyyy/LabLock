<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; img-src 'self' https:;" />
  <title>Halisy Lablock</title>
  <link rel="stylesheet" href="toolbar.css" />
</head>
<body>
  <div class="toolbar-brand" aria-hidden="true">
    <span class="toolbar-brand-mark">HL</span>
    <span class="toolbar-brand-name">Halisy Lablock</span>
  </div>

  <nav id="site-tabs" class="site-tabs" aria-label="Allowed sites" hidden></nav>

  <div class="toolbar-center">
    <button id="back-btn" type="button" class="toolbar-btn toolbar-btn-secondary" aria-label="Go back to the previous page" disabled>
      <svg class="toolbar-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"></path>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back</span>
    </button>

    <button id="home-btn" type="button" class="toolbar-btn" aria-label="Return to home grid">
      <svg class="toolbar-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </button>
  </div>

  <div id="power-btns" class="toolbar-power" hidden>
    <button id="shutdown-btn" type="button" class="toolbar-btn toolbar-btn-power" aria-label="Shut down this computer" title="Shut down">
      <svg class="toolbar-btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
      <span>Shut down</span>
    </button>
    <button id="restart-btn" type="button" class="toolbar-btn toolbar-btn-power" aria-label="Restart this computer" title="Restart">
      <svg class="toolbar-btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span>Restart</span>
    </button>
  </div>

  <script src="toolbar.js"></script>
</body>
</html>
